# Veyra (veyra-power): Deckel zu -> Ruhezustand, auch am Netzteil; mit externem Bildschirm
# (angedockt) nichts tun. Einschalttaste kurz -> Herunterfahren. Eigene Werte gehoeren nach
# /etc/systemd/logind.conf.d/.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
HandlePowerKey=poweroff
