<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Veyra hat kein PAM und damit keine Sitzungen (at_console greift nie). Zugriff auf BlueZ
     bekommen deshalb die Gruppe bluetooth (Benutzer, die Geraete koppeln duerfen) und der
     Tondienst pipewire (Bluetooth-Kopfhoerer ueber WirePlumber). BlueZ selbst erlaubt in
     bluetooth.conf allen Benutzern den Zugriff (context="default"); diese Datei wird danach
     gelesen und nimmt das zurueck. root behaelt seine Regel aus bluetooth.conf. -->
<busconfig>
  <policy context="default">
    <deny send_destination="org.bluez"/>
  </policy>
  <policy group="bluetooth">
    <allow send_destination="org.bluez"/>
  </policy>
  <policy user="pipewire">
    <allow send_destination="org.bluez"/>
  </policy>
</busconfig>
