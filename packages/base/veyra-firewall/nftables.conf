#!/usr/sbin/nft -f
# Veyra-Firewall (Paket veyra-firewall). Grundsatz: eingehend alles verwerfen, was nicht
# Antwort auf eine eigene Verbindung oder fuer den Betrieb noetig ist. Ausgehend frei.
# Diese Datei ist eine Konfigurationsdatei: Aenderungen bleiben bei Updates erhalten
# (neue Fassung kommt als nftables.conf.vpkgnew). Neu laden: systemctl reload veyra-firewall
flush ruleset

table inet veyra {
	chain eingang {
		type filter hook input priority filter; policy drop;

		iif "lo" accept
		ct state established,related accept
		ct state invalid drop

		# IPv6 braucht ICMPv6 fuer Nachbarn, Router und Fehlermeldungen
		meta l4proto ipv6-icmp icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
		# IPv4: Fehlermeldungen (Pfad-MTU, Erreichbarkeit)
		meta l4proto icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
		# Ping beantworten, begrenzt
		meta l4proto icmp icmp type echo-request limit rate 5/second accept
		meta l4proto ipv6-icmp icmpv6 type echo-request limit rate 5/second accept

		# DHCP-Antworten (Angebote kommen auch als Broadcast, ausserhalb von conntrack)
		udp sport 67 udp dport 68 accept
		ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept
	}

	chain weiterleiten {
		type filter hook forward priority filter; policy drop;
	}

	chain ausgang {
		type filter hook output priority filter; policy accept;
	}
}
