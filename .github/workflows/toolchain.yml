        if: success() || failure()
        run: python3 image/bluetooth-test.py veyra-audio.img bluetooth-logs

      # Zuletzt: richtet auf der Platte einen Test-Zugangspunkt ein (bleibt dort).
      - name: WLAN-Test (mac80211_hwsim, hostapd, WPA2, WPA3-SAE, DHCP, IPv6, Autoconnect)
