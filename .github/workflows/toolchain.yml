          key=$RUNNER_TEMP/veyra-signing-key.pem
          printf '%s\n' "$VPKG_SIGNING_KEY" > "$key"
          build/scripts/sign-packages.sh "$key" connect
          rm -f "$key"

      # Wie "vpkg install @veyra-audio @veyra-bluetooth" auf einem fertigen System (nur virtuelle
      # Platte); hostapd nur fuer den Test-Zugangspunkt im WLAN-Test.
      - name: veyra-audio und veyra-bluetooth ins Abbild installieren
