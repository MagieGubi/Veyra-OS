          p = json.load(sys.stdin)["partitiontable"]["partitions"][1]
          print(p["start"] * 512, p["size"] * 512)')
          loop=$(sudo losetup --find --show --read-only --offset "$start" --sizelimit "$size" veyra-0.6.img)
          sudo mkdir -p /mnt/quelle
          sudo mount -o ro "$loop" /mnt/quelle
          truncate -s 8G rettung.img
          sudo packages/base/veyra-installer/veyra-install installiere "$PWD/rettung.img" \
            --quelle /mnt/quelle --mit-selbsttest --bestaetigt "$PWD/rettung.img" | tee installer.log
          sudo umount /mnt/quelle
          sudo losetup -d "$loop"

      - name: ISO bauen
        run: |
          sudo image/build-iso.sh veyra-0.6.img k/kernel veyra-0.6-live.iso
          sudo chown "$(id -u):$(id -g)" veyra-0.6-live.iso
          rm -f veyra-0.6.img
          sha256sum veyra-0.6-live.iso | tee SHA256SUMS

      - name: Boot-Test von CD (UEFI) und Selbsttest
        run: SELFTEST=1 MEDIUM=cdrom image/boot-test.sh veyra-0.6-live.iso boot-live.log 600

      # Recovery (0.6 Phase 4): Platte absichtlich beschaedigen (Booteintrag, Paketdatei),
      # von der Live-ISO aus mit veyra-recovery reparieren, danach startet sie wieder.
      - name: Recovery-Test (beschaedigte Platte, Reparatur von der Live-ISO)
        run: |
          python3 image/recovery-test.py rettung.img veyra-0.6-live.iso recovery-logs
          rm -f rettung.img

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: veyra-live-iso
          path: |
            veyra-0.6-live.iso
            SHA256SUMS
            boot-live.log
          retention-days: 7
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: veyra-recovery-test
          path: |
            installer.log
            recovery-logs
          retention-days: 7
          if-no-files-found: ignore
