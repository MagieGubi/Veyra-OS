# Baut die Veyra-Cross-Toolchain (Stufe 2) und prueft VPKG.
# Laeuft bei jedem Push auf main und per Knopfdruck unter "Actions".
name: Toolchain

on:
  push:
    branches: [main]
    paths-ignore: ['.github/workflows/probe.yml', 'docs/**']
  workflow_dispatch:

# Ein neuer Push ersetzt einen laufenden Build (gleiche Caches, sonst doppelte Arbeit).
concurrency:
  group: toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vpkg:
    name: VPKG-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Werkzeuge installieren
        run: sudo apt-get update && sudo apt-get install -y zstd shellcheck dosfstools mtools
      - name: shellcheck
        run: shellcheck -x build/scripts/* toolchain/*.sh temptools/*.sh kernel/*.sh stage4/*.sh stage4/chroot/*.sh image/*.sh tests/vpkg/*.sh tests/boot/*.sh tests/konten/*.sh tests/image/*.sh tests/installer/*.sh tests/firewall/*.sh tests/recovery/*.sh tests/hwinfo/*.sh tests/network/*.sh tests/audio/*.sh tests/bluetooth/*.sh packages/base/veyra-konten/veyra-* packages/base/veyra-desktop/veyra-desktop packages/test/veyra-desktop-test/bild.sh packages/base/veyra-installer/veyra-rootpruefung
      - name: vpkg-build und vpkg-verify testen
        run: bash tests/vpkg/run.sh
      - name: VPKG testen (installieren, entfernen, Abhaengigkeiten, Transaktionen)
        run: |
          python3 -m py_compile packages/base/vpkg/vpkg
          build/scripts/fetch-extra.sh "$RUNNER_TEMP/quellen"
          VEYRA_QUELLEN=$RUNNER_TEMP/quellen bash tests/vpkg/vpkg-test.sh
      - name: Firewall-Regeln testen
        run: sudo apt-get install -y nftables && sudo bash tests/firewall/firewall-test.sh
      - name: Boot-Diagnose testen (kuenstliche Konsolen-Logs)
        run: bash tests/boot/diagnose-test.sh && bash tests/boot/kernel-update-test.sh && bash tests/recovery/recovery-test.sh && bash tests/hwinfo/hwinfo-test.sh && bash tests/network/network-test.sh && bash tests/audio/audio-test.sh && bash tests/bluetooth/bluetooth-test.sh
      - name: Konten testen (Ersteinrichtung, Kontenpruefung)
        run: sudo bash tests/konten/konten-test.sh
      - name: Abbild-Varianten testen (dev und test, mit Probe-System)
        run: sudo bash tests/image/variante-test.sh
      - name: Installer testen (nur virtuelle Platten, Probe-System)
        run: |
          python3 -m py_compile packages/base/veyra-installer/veyra_install.py packages/base/veyra-installer/veyra_fat.py
          sudo bash tests/installer/installer-test.sh
      - name: Rezepte und Quellenlisten pruefen
        run: |
          for r in packages/*/*/recipe.sh; do bash -n "$r"; done
          # Teile 1 bis 3: LFS-Pakete (GNU-Signatur oder LFS-MD5). Teil 4 (ausserhalb LFS):
          # jede Quelle muss in stage4/sources-4.list mit Signatur und Schluessel stehen.
          for o in stage4/order-[123].list; do
            build/scripts/gen-sources-list.sh "$o" packages/core stage4/lfs-12.4-md5sums > /dev/null
          done
          grep -vE '^\s*(#|$)' stage4/order-4.list | while read -r name; do
            ( sources=(); . "packages/core/$name/recipe.sh"
              for u in "${sources[@]}"; do
                awk -v u="$u" '$1 == u && NF == 3 {f=1} END {exit !f}' stage4/sources-4.list \
                  || { echo "Keine Pruefung fuer $u in stage4/sources-4.list" >&2; exit 1; }
              done )
          done
          # Stufe 5 (Desktop-Grundlage, Rezepte in packages/desktop): ebenso in
          # stage4/sources-5.list (Teil 1) und stage4/sources-6.list (Teil 2)
          # Stufe 6 (Connectivity, Rezepte in packages/connect): order-7 in sources-7.list
          for n in 5 6 7; do
            d=packages/desktop; [ "$n" != 7 ] || d=packages/connect
            grep -vE '^\s*(#|$)' "stage4/order-$n.list" | while read -r name; do
              ( sources=(); . "$d/$name/recipe.sh"
                for u in "${sources[@]}"; do
                  awk -v u="$u" '$1 == u && NF == 3 {f=1} END {exit !f}' "stage4/sources-$n.list" \
                    || { echo "Keine Pruefung fuer $u in stage4/sources-$n.list" >&2; exit 1; }
                done )
            done
          done
          build/scripts/check-pinned.sh

  toolchain:
    name: Cross-Toolchain (Stufe 2)
    needs: vpkg
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: Fertige Toolchain aus dem Cache holen
        id: cache
        uses: actions/cache@v5
        with:
          path: out
          key: toolchain-stage2-${{ hashFiles('toolchain/**', 'build/container/Dockerfile', 'build/scripts/ci-toolchain.sh') }}

      - name: Platz auf dem Runner schaffen
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Bootstrap-Container bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: docker build -t veyra-bootstrap build/container

      - name: Cross-Toolchain bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p out
          docker run --rm -v "$PWD:/repo:ro" -v "$PWD/out:/out" veyra-bootstrap /repo/build/scripts/ci-toolchain.sh

      - name: Pruefsummen
        run: sudo chown -R "$(id -u):$(id -g)" out && cd out && sha256sum veyra-toolchain-stage2.tar.zst | tee SHA256SUMS

      - name: Ergebnis hochladen
        uses: actions/upload-artifact@v6
        with:
          name: toolchain-stage2
          path: |
            out/veyra-toolchain-stage2.tar.zst
            out/sources.lock
            out/build-cross.log
            out/SHA256SUMS
          retention-days: 1   # nur Zwischenstand fuer die folgenden Jobs

      - name: Gesperrte Quellen anzeigen
        run: cat out/*sources.lock

  temptools:
    name: Temporaere Werkzeuge (Stufe 3)
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: Fertige Stufe 3 aus dem Cache holen
        id: cache
        uses: actions/cache@v5
        with:
          path: out
          key: temptools-stage3-${{ hashFiles('toolchain/**', 'temptools/**', 'build/container/Dockerfile', 'build/scripts/ci-toolchain.sh', 'build/scripts/ci-temptools.sh') }}

      - name: Toolchain aus Stufe 2 holen
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v7
        with:
          name: toolchain-stage2
          path: in

      - name: Platz auf dem Runner schaffen
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Bootstrap-Container bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: docker build -t veyra-bootstrap build/container

      - name: Temporaere Werkzeuge bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p out
          docker run --rm -v "$PWD:/repo:ro" -v "$PWD/in:/in:ro" -v "$PWD/out:/out" veyra-bootstrap /repo/build/scripts/ci-temptools.sh

      - name: Pruefsummen
        run: sudo chown -R "$(id -u):$(id -g)" out && cd out && sha256sum veyra-temptools-stage3.tar.zst | tee SHA256SUMS

      - name: Ergebnis hochladen
        uses: actions/upload-artifact@v6
        with:
          name: temptools-stage3
          path: |
            out/veyra-temptools-stage3.tar.zst
            out/temptools-sources.lock
            out/build-temp.log
            out/SHA256SUMS
          retention-days: 1   # nur Zwischenstand fuer die folgenden Jobs

      - name: Gesperrte Quellen anzeigen
        run: cat out/*sources.lock

  kernel:
    name: Veyra-Kernel (Phase 4, Build ${{ matrix.build }})
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix:
        build: [a, b]
    steps:
      - uses: actions/checkout@v5

      - name: Fertigen Kernel aus dem Cache holen
        id: cache
        uses: actions/cache@v5
        with:
          path: out
          key: kernel-${{ matrix.build }}-${{ hashFiles('toolchain/**', 'kernel/**', 'build/container/Dockerfile', 'build/scripts/ci-toolchain.sh', 'build/scripts/ci-kernel.sh') }}

      - name: Toolchain aus Stufe 2 holen
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v7
        with:
          name: toolchain-stage2
          path: in

      - name: Bootstrap-Container bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: docker build -t veyra-bootstrap build/container

      - name: Kernel bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p out
          docker run --rm -v "$PWD:/repo:ro" -v "$PWD/in:/in:ro" -v "$PWD/out:/out" veyra-bootstrap /repo/build/scripts/ci-kernel.sh

      - name: Ergebnis hochladen
        run: sudo chown -R "$(id -u):$(id -g)" out
      - uses: actions/upload-artifact@v6
        with:
          name: kernel-${{ matrix.build }}
          path: out
          retention-days: 1   # nur Zwischenstand fuer die folgenden Jobs

      - name: Pruefsummen und gesperrte Quellen anzeigen
        run: cat out/kernel/SHA256SUMS out/kernel-sources.lock

  kernel-reproducible:
    name: Kernel reproduzierbar?
    needs: kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: kernel-a
          path: a
      - uses: actions/download-artifact@v7
        with:
          name: kernel-b
          path: b
      - name: Zwei unabhaengige Builds vergleichen
        run: |
          if diff -u a/kernel/modules.sha256 b/kernel/modules.sha256 && diff -u a/kernel/SHA256SUMS b/kernel/SHA256SUMS; then
            echo "Bit-identisch:"; cat a/kernel/SHA256SUMS
          else
            echo "FEHLER: die beiden Kernel-Builds unterscheiden sich" >&2; exit 1
          fi

  stage4a:
    name: Basissystem in chroot (Stufe 4a)
    needs: temptools
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: Cache-Schluessel berechnen
        id: key
        run: echo "k=$(build/scripts/stage-key.sh 4a)" >> "$GITHUB_OUTPUT"

      - name: Fertige Stufe 4a aus dem Cache holen
        id: cache
        uses: actions/cache@v5
        with:
          path: out
          key: stage4a-${{ steps.key.outputs.k }}

      - name: Stufe 3 holen
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v7
        with:
          name: temptools-stage3
          path: in

      - name: Platz auf dem Runner schaffen
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Bootstrap-Container bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: docker build -t veyra-bootstrap build/container

      - name: Stufe 4a in chroot bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p out
          docker run --rm --privileged -v "$PWD:/repo:ro" -v "$PWD/in:/in:ro" -v "$PWD/out:/out" veyra-bootstrap /repo/build/scripts/ci-stage4a.sh

      - name: Pruefsummen
        run: sudo chown -R "$(id -u):$(id -g)" out && cd out && sha256sum veyra-stage4a.tar.zst | tee SHA256SUMS

      - name: Ergebnis hochladen
        uses: actions/upload-artifact@v6
        with:
          name: stage4a
          path: |
            out/veyra-stage4a.tar.zst
            out/stage4-sources.lock
            out/build-stage4a.log
            out/SHA256SUMS
          retention-days: 1   # nur Zwischenstand fuer die folgenden Jobs

      - name: Gesperrte Quellen anzeigen
        run: cat out/stage4-sources.lock

  stage4b-1:
    name: Basispakete Teil 1, glibc bis GCC (Stufe 4b)
    needs: stage4a
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Cache-Schluessel berechnen
        id: key
        run: echo "k=$(build/scripts/stage-key.sh 1)" >> "$GITHUB_OUTPUT"

      - name: Fertigen Teil 1 aus dem Cache holen
        id: cache
        uses: actions/cache@v5
        with:
          path: out
          key: stage4b-1-${{ steps.key.outputs.k }}

      - name: Vorige Stufe holen
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v7
        with:
          name: stage4a
          path: in

      - name: Platz auf dem Runner schaffen
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Bootstrap-Container bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: docker build -t veyra-bootstrap build/container

      - name: Pakete bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p out
          rm -f in/SHA256SUMS
          docker run --rm --privileged -v "$PWD:/repo:ro" -v "$PWD/in:/in:ro" -v "$PWD/out:/out" veyra-bootstrap /repo/build/scripts/ci-stage4b.sh 1

      - name: Ergebnis hochladen
        run: sudo chown -R "$(id -u):$(id -g)" out
      - uses: actions/upload-artifact@v6
        with:
          name: stage4b-1
          path: |
            out/veyra-stage4b-1.tar.zst
            out/packages
            out/stage4-sources.lock
            out/build-stage4b-1.log
          retention-days: 1   # nur Zwischenstand fuer die folgenden Jobs
      - uses: actions/upload-artifact@v6
        with:
          name: pakete-4b-1
          path: out/packages
          retention-days: 1   # nur Zwischenstand fuer die folgenden Jobs

      - name: Paket-Pruefsummen und gesperrte Quellen anzeigen
        run: cat out/packages/SHA256SUMS out/stage4-sources.lock

  stage4b-2:
    name: Basispakete Teil 2, ncurses bis Jinja2 (Stufe 4b)
    needs: stage4b-1
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Cache-Schluessel berechnen
        id: key
        run: echo "k=$(build/scripts/stage-key.sh 2)" >> "$GITHUB_OUTPUT"

      - name: Fertigen Teil 2 aus dem Cache holen
        id: cache
        uses: actions/cache@v5
        with:
          path: out
          key: stage4b-2-${{ steps.key.outputs.k }}

      - name: Vorige Stufe holen
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v7
        with:
          name: stage4b-1
          path: in

      - name: Platz auf dem Runner schaffen
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Bootstrap-Container bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: docker build -t veyra-bootstrap build/container

      - name: Pakete bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p out
          rm -f in/SHA256SUMS
          docker run --rm --privileged -v "$PWD:/repo:ro" -v "$PWD/in:/in:ro" -v "$PWD/out:/out" veyra-bootstrap /repo/build/scripts/ci-stage4b.sh 2

      - name: Ergebnis hochladen
        run: sudo chown -R "$(id -u):$(id -g)" out
      - uses: actions/upload-artifact@v6
        with:
          name: stage4b-2
          path: |
            out/veyra-stage4b-2.tar.zst
            out/packages
            out/stage4-sources.lock
            out/build-stage4b-2.log
          retention-days: 1   # nur Zwischenstand fuer die folgenden Jobs
      - uses: actions/upload-artifact@v6
        with:
          name: pakete-4b-2
          path: out/packages
          retention-days: 1   # nur Zwischenstand fuer die folgenden Jobs

      - name: Paket-Pruefsummen und gesperrte Quellen anzeigen
        run: cat out/packages/SHA256SUMS out/stage4-sources.lock

  stage4b-3:
    name: Basispakete Teil 3, systemd bis e2fsprogs (Stufe 4b)
    needs: stage4b-2
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Cache-Schluessel berechnen
        id: key
        run: echo "k=$(build/scripts/stage-key.sh 3)" >> "$GITHUB_OUTPUT"

      - name: Fertigen Teil 3 aus dem Cache holen
        id: cache
        uses: actions/cache@v5
        with:
          path: out
          key: stage4b-3-${{ steps.key.outputs.k }}

      - name: Vorige Stufe holen
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v7
        with:
          name: stage4b-2
          path: in

      - name: Platz auf dem Runner schaffen
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Bootstrap-Container bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: docker build -t veyra-bootstrap build/container

      - name: Pakete bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p out
          rm -f in/SHA256SUMS
          docker run --rm --privileged -v "$PWD:/repo:ro" -v "$PWD/in:/in:ro" -v "$PWD/out:/out" veyra-bootstrap /repo/build/scripts/ci-stage4b.sh 3

      - name: Ergebnis hochladen
        run: sudo chown -R "$(id -u):$(id -g)" out
      - uses: actions/upload-artifact@v6
        with:
          name: stage4b-3
          path: |
            out/veyra-stage4b-3.tar.zst
            out/packages
            out/stage4-sources.lock
            out/build-stage4b-3.log
          retention-days: 1   # nur Zwischenstand fuer die folgenden Jobs
      - uses: actions/upload-artifact@v6
        with:
          name: pakete-4b-3
          path: out/packages
          retention-days: 1   # nur Zwischenstand fuer die folgenden Jobs

      - name: Paket-Pruefsummen und gesperrte Quellen anzeigen
        run: cat out/packages/SHA256SUMS out/stage4-sources.lock

  stage4b-4:
    name: Basispakete Teil 4, nftables (Stufe 4b, ausserhalb LFS)
    needs: stage4b-3
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Cache-Schluessel berechnen
        id: key
        run: echo "k=$(build/scripts/stage-key.sh 4)" >> "$GITHUB_OUTPUT"

      - name: Fertigen Teil 4 aus dem Cache holen
        id: cache
        uses: actions/cache@v5
        with:
          path: out
          key: stage4b-4-${{ steps.key.outputs.k }}

      - name: Vorige Stufe holen
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v7
        with:
          name: stage4b-3
          path: in

      - name: Platz auf dem Runner schaffen
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Bootstrap-Container bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: docker build -t veyra-bootstrap build/container

      - name: Pakete bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p out
          rm -rf in/SHA256SUMS in/packages in/stage4-sources.lock in/build-stage4b-3.log
          docker run --rm --privileged -v "$PWD:/repo:ro" -v "$PWD/in:/in:ro" -v "$PWD/out:/out" veyra-bootstrap /repo/build/scripts/ci-stage4b-4.sh

      - name: Ergebnis hochladen
        run: sudo chown -R "$(id -u):$(id -g)" out
      - uses: actions/upload-artifact@v6
        with:
          name: stage4b-4
          path: |
            out/veyra-stage4b-4.tar.zst
            out/packages
            out/stage4-sources.lock
            out/build-stage4b-4.log
          retention-days: 1   # nur Zwischenstand fuer die folgenden Jobs
      - uses: actions/upload-artifact@v6
        with:
          name: pakete-4b-4
          path: out/packages
          retention-days: 1   # nur Zwischenstand fuer die folgenden Jobs

      - name: Paket-Pruefsummen und gesperrte Quellen anzeigen
        run: cat out/packages/SHA256SUMS out/stage4-sources.lock

  stage5:
    name: Desktop-Grundlage (Stufe 5, Wayland, wlroots, cage, foot)
    needs: stage4b-4
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Cache-Schluessel berechnen
        id: key
        run: echo "k=$(build/scripts/stage-key.sh 5)" >> "$GITHUB_OUTPUT"

      - name: Fertige Stufe 5 aus dem Cache holen
        id: cache
        uses: actions/cache@v5
        with:
          path: out
          key: stage5-${{ steps.key.outputs.k }}

      - name: Basissystem holen
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v7
        with:
          name: stage4b-4
          path: in

      - name: Platz auf dem Runner schaffen
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Bootstrap-Container bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: docker build -t veyra-bootstrap build/container

      - name: Pakete bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p out
          rm -rf in/SHA256SUMS in/packages in/stage4-sources.lock in/build-stage4b-4.log
          docker run --rm --privileged -v "$PWD:/repo:ro" -v "$PWD/in:/in:ro" -v "$PWD/out:/out" veyra-bootstrap /repo/build/scripts/ci-stage5.sh

      - name: Ergebnis hochladen
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" out || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage5-log
          path: |
            out/build-stage5.log
            out/stage5-sources.lock
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        with:
          name: pakete-5
          path: out/packages
          retention-days: 1   # nur Zwischenstand fuer den Desktop-Test

      - name: Paket-Pruefsummen und gesperrte Quellen anzeigen
        run: cat out/packages/SHA256SUMS out/stage5-sources.lock

  stage5-2:
    name: Desktop-Grundlage Teil 2 (Stufe 5, Mesa, Go, kitty)
    needs: [stage4b-4, stage5]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Cache-Schluessel berechnen
        id: key
        run: echo "k=$(build/scripts/stage-key.sh 6)" >> "$GITHUB_OUTPUT"

      - name: Fertigen Teil 2 aus dem Cache holen
        id: cache
        uses: actions/cache@v5
        with:
          path: out
          key: stage5-2-${{ steps.key.outputs.k }}

      - name: Basissystem holen
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v7
        with:
          name: stage4b-4
          path: in
      - name: Pakete aus Teil 1 holen
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v7
        with:
          name: pakete-5
          path: in/pakete-5

      - name: Platz auf dem Runner schaffen
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Bootstrap-Container bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: docker build -t veyra-bootstrap build/container

      - name: Pakete bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p out
          rm -rf in/SHA256SUMS in/packages in/stage4-sources.lock in/build-stage4b-4.log in/pakete-5/SHA256SUMS
          docker run --rm --privileged -v "$PWD:/repo:ro" -v "$PWD/in:/in:ro" -v "$PWD/out:/out" veyra-bootstrap /repo/build/scripts/ci-stage5-2.sh

      - name: Ergebnis hochladen
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" out || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage5-2-log
          path: |
            out/build-stage5-2.log
            out/stage5-2-sources.lock
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        with:
          name: pakete-5-2
          path: out/packages
          retention-days: 1   # nur Zwischenstand fuer den Desktop-Test

      - name: Paket-Pruefsummen und gesperrte Quellen anzeigen
        run: cat out/packages/SHA256SUMS out/stage5-2-sources.lock

  stage6:
    name: Connectivity-Grundlage (Stufe 6, GLib, ALSA, PipeWire, BlueZ)
    needs: stage4b-4
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Cache-Schluessel berechnen
        id: key
        run: echo "k=$(build/scripts/stage-key.sh 7)" >> "$GITHUB_OUTPUT"

      - name: Fertige Stufe 6 aus dem Cache holen
        id: cache
        uses: actions/cache@v5
        with:
          path: out
          key: stage6-${{ steps.key.outputs.k }}

      - name: Basissystem holen
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v7
        with:
          name: stage4b-4
          path: in

      - name: Platz auf dem Runner schaffen
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Bootstrap-Container bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: docker build -t veyra-bootstrap build/container

      - name: Pakete bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p out
          rm -rf in/SHA256SUMS in/packages in/stage4-sources.lock in/build-stage4b-4.log
          docker run --rm --privileged -v "$PWD:/repo:ro" -v "$PWD/in:/in:ro" -v "$PWD/out:/out" veyra-bootstrap /repo/build/scripts/ci-stage6.sh

      - name: Ergebnis hochladen
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" out || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage6-log
          path: |
            out/build-stage6.log
            out/stage6-sources.lock
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        with:
          name: pakete-6
          path: out/packages
          retention-days: 1   # nur Zwischenstand fuer den Connectivity-Test

      - name: Paket-Pruefsummen und gesperrte Quellen anzeigen
        run: cat out/packages/SHA256SUMS out/stage6-sources.lock

  image:
    name: Abbild und Boot-Test in QEMU (Phase 5)
    needs: [stage4b-4, kernel-reproducible]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Werkzeuge installieren und KVM freigeben
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd mtools dosfstools fdisk e2fsprogs qemu-system-x86 qemu-utils ovmf bc
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Basissystem holen
        uses: actions/download-artifact@v7
        with:
          name: stage4b-4
          path: sys
      - name: Kernel holen
        uses: actions/download-artifact@v7
        with:
          name: kernel-a
          path: k

      - name: Basispakete holen (fuer die VPKG-Datenbank)
        uses: actions/download-artifact@v7
        with:
          pattern: pakete-4b-*
          path: basis

      - name: Zusatzpakete bauen (veyra-release, veyra-netzwerk, veyra-konten, veyra-installer, veyra-zertifikate, veyra-sicherheit, veyra-firewall, Metapakete, vpkg, Selbsttest, Firmware)
        run: |
          build/scripts/fetch-extra.sh "$RUNNER_TEMP/quellen"
          for r in packages/base/veyra-release packages/base/veyra-netzwerk packages/base/veyra-konten packages/base/veyra-installer packages/base/veyra-zertifikate packages/base/veyra-sicherheit packages/base/veyra-firewall packages/base/veyra-base packages/base/veyra-network packages/base/veyra-security packages/base/veyra-development packages/base/veyra-recovery packages/base/veyra-boot packages/base/veyra-hwinfo packages/base/vpkg packages/test/veyra-selftest; do
            build/scripts/vpkg-build --srcdir "$RUNNER_TEMP/quellen" --outdir extra "$r"
          done
          build/scripts/vpkg-build --srcdir "$PWD" --outdir extra/selftest packages/test/vpkg-demo
          # Hardwareabhaengig (Firmware): nicht im VM-Abbild, aber im Repository und im
          # Testabbild fuer echte Rechner (build-image.sh liest nur extra/ selbst).
          build/scripts/vpkg-build --srcdir "$RUNNER_TEMP/quellen" --outdir extra/hardware packages/base/veyra-firmware-intel-wlan

      - name: Pakete signieren (wenn das Secret VPKG_SIGNING_KEY eingerichtet ist)
        env:
          VPKG_SIGNING_KEY: ${{ secrets.VPKG_SIGNING_KEY }}
        run: |
          if [ -z "$VPKG_SIGNING_KEY" ]; then
            echo "::warning::Secret VPKG_SIGNING_KEY fehlt: Pakete bleiben unsigniert, das Abbild prueft keine Signaturen."
            exit 0
          fi
          umask 077
          key=$RUNNER_TEMP/veyra-signing-key.pem
          printf '%s\n' "$VPKG_SIGNING_KEY" > "$key"
          build/scripts/vpkg-build --srcdir "$PWD" --outdir extra packages/base/veyra-keyring
          build/scripts/sign-packages.sh "$key" extra basis
          rm -f "$key"

      - name: Abbild bauen
        run: |
          sudo image/build-image.sh sys/veyra-stage4b-4.tar.zst k/kernel extra veyra-0.6.img basis
          sudo chown "$(id -u):$(id -g)" veyra-0.6.img

      - name: Boot-Test (UEFI, kein Bootloader) und VPKG-Selbsttest
        run: SELFTEST=1 image/boot-test.sh veyra-0.6.img boot.log 600

      - name: Abbild packen
        if: always()
        run: |
          if [ -f veyra-0.6.img ]; then zstd -q -T0 -10 veyra-0.6.img -o veyra-0.6.img.zst; sha256sum veyra-0.6.img* | tee SHA256SUMS; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: veyra-0.6
          path: |
            veyra-0.6.img.zst
            boot.log
            SHA256SUMS
          retention-days: 7

      # Fuer VirtualBox: dasselbe Abbild als VDI-Festplatte (VM mit EFI, Anleitung in
      # docs/virtualbox.md). Dynamisch belegt, also nur so gross wie die Daten darin.
      - name: VirtualBox-Festplatte (VDI)
        if: success()
        run: |
          rm -f veyra-0.6.img.zst
          qemu-img convert -f raw -O vdi veyra-0.6.img veyra-0.6.vdi
          sha256sum veyra-0.6.vdi | tee SHA256SUMS-vdi
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: veyra-virtualbox
          path: |
            veyra-0.6.vdi
            SHA256SUMS-vdi
            docs/virtualbox.md
          retention-days: 7

      # Installer (P3-2): das Entwicklungsabbild dient als Quelle (wie das SquashFS der
      # Live-ISO), Ziel ist eine leere virtuelle Platte. Danach startet QEMU das installierte
      # System von dieser Platte; der Selbsttest bleibt dafuer drin (--mit-selbsttest).
      - name: Installer auf leere virtuelle Platte
        if: success()
        run: |
          set -o pipefail
          read -r start size < <(sfdisk -J veyra-0.6.img | python3 -c '
          import json, sys
          p = json.load(sys.stdin)["partitiontable"]["partitions"][1]
          print(p["start"] * 512, p["size"] * 512)')
          loop=$(sudo losetup --find --show --read-only --offset "$start" --sizelimit "$size" veyra-0.6.img)
          sudo mkdir -p /mnt/quelle
          sudo mount -o ro "$loop" /mnt/quelle
          truncate -s 8G installiert.img   # sparse; das Basissystem braucht knapp 6 GiB
          sudo packages/base/veyra-installer/veyra-install installiere "$PWD/installiert.img" \
            --quelle /mnt/quelle --mit-selbsttest --bestaetigt "$PWD/installiert.img" | tee installer.log
          sudo umount /mnt/quelle
          sudo losetup -d "$loop"
          sfdisk -l installiert.img | tee -a installer.log
      # Wie ein Mensch: Ersteinrichtung an Konsole 1 eintippen, als neuer Benutzer anmelden,
      # su, herunterfahren, von derselben Platte neu starten, als root anmelden.
      - name: Installiertes System starten, einrichten, anmelden, neu starten
        if: success()
        run: |
          python3 image/install-test.py installiert.img installiert-logs
          rm -f installiert.img
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: veyra-installer-test
          path: |
            installer.log
            installiert-logs
          retention-days: 7
          if-no-files-found: ignore

      - name: Paket-Repository zusammenstellen
        if: success()
        env:
          VPKG_SIGNING_KEY: ${{ secrets.VPKG_SIGNING_KEY }}
        run: |
          mkdir -p repo
          find basis extra -maxdepth 2 -name '*.vpkg' -not -path '*/selftest/*' -exec cp {} repo/ \;
          find basis extra -maxdepth 2 -name '*.vpkg.sig' -not -path '*/selftest/*' -exec cp {} repo/ \;
          # Stand des Index = Commit-Zeit: steigt mit jedem Commit, VPKG lehnt aeltere Indizes ab.
          python3 packages/base/vpkg/vpkg index --stand "$(git log -1 --format=%ct)" repo
          if [ -n "$VPKG_SIGNING_KEY" ]; then
            umask 077
            key=$RUNNER_TEMP/veyra-signing-key.pem
            printf '%s\n' "$VPKG_SIGNING_KEY" > "$key"
            build/scripts/sign-packages.sh "$key" repo
            rm -f "$key"
            # Gegenprobe wie ein Veyra-System: Index-Signatur, Stand und ein Paket aus dem Repository.
            mkdir -p "$RUNNER_TEMP/probe/var/lib/vpkg/installed"
            python3 packages/base/vpkg/vpkg --root "$RUNNER_TEMP/probe" \
              --pubkey packages/base/veyra-keyring/veyra-2026.pem install --no-scripts \
              --repo "$PWD/repo" veyra-release
          fi
          (cd repo && sha256sum ./*.vpkg > SHA256SUMS)
          echo "Pakete: $(ls repo/*.vpkg | wc -l), signiert: $(ls repo/*.vpkg.sig 2>/dev/null | wc -l), Index signiert: $([ -f repo/index.toml.sig ] && echo ja || echo nein)"
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: veyra-repo
          path: repo
          retention-days: 7

      # Testabbild fuer echte Rechner (USB-Stick): root gesperrt bis zur Ersteinrichtung an
      # Konsole 1. Der Boot-Test laeuft ohne Anmeldung; der Selbsttest prueft die Konten.
      - name: Testabbild bauen (VARIANTE=test)
        if: success()
        run: |
          rm -f veyra-0.6.img veyra-0.6.vdi
          cp extra/hardware/*.vpkg* extra/
          sudo VARIANTE=test image/build-image.sh sys/veyra-stage4b-4.tar.zst k/kernel extra veyra-0.6-test.img basis
          sudo chown "$(id -u):$(id -g)" veyra-0.6-test.img
      - name: Boot-Test des Testabbilds und Selbsttest
        if: success()
        run: SELFTEST=1 image/boot-test.sh veyra-0.6-test.img boot-test.log 600
      - name: Testabbild packen
        if: success()
        run: |
          zstd -q -T0 -10 --rm veyra-0.6-test.img -o veyra-0.6-test.img.zst
          sha256sum veyra-0.6-test.img.zst | tee SHA256SUMS-test
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: veyra-0.6-test
          path: |
            veyra-0.6-test.img.zst
            boot-test.log
            SHA256SUMS-test
            docs/hardware-test.md
          retention-days: 7

  desktop:
    name: Desktop in QEMU (cage, kitty, virtio-gpu, Bildschirmfoto)
    needs: [image, stage5, stage5-2]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Werkzeuge installieren und KVM freigeben
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd fdisk e2fsprogs qemu-system-x86 ovmf
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Abbild holen
        uses: actions/download-artifact@v7
        with:
          name: veyra-0.6
          path: img
      - name: Pakete der Stufe 5 holen
        uses: actions/download-artifact@v7
        with:
          name: pakete-5
          path: desktop
      - name: Pakete der Stufe 5, Teil 2 holen
        uses: actions/download-artifact@v7
        with:
          name: pakete-5-2
          path: desktop2

      - name: veyra-desktop und veyra-desktop-test bauen, Repository-Index
        run: |
          mv desktop2/*.vpkg desktop/
          rm -rf desktop2 desktop/SHA256SUMS
          for r in packages/base/veyra-desktop packages/test/veyra-desktop-test; do
            build/scripts/vpkg-build --srcdir "$RUNNER_TEMP/quellen" --outdir desktop "$r"
          done
          python3 packages/base/vpkg/vpkg index --stand "$(git log -1 --format=%ct)" desktop

      - name: Pakete signieren (wenn das Secret VPKG_SIGNING_KEY eingerichtet ist)
        env:
          VPKG_SIGNING_KEY: ${{ secrets.VPKG_SIGNING_KEY }}
        run: |
          if [ -z "$VPKG_SIGNING_KEY" ]; then
            echo "::warning::Secret VPKG_SIGNING_KEY fehlt: Desktop-Pakete bleiben unsigniert."
            exit 0
          fi
          umask 077
          key=$RUNNER_TEMP/veyra-signing-key.pem
          printf '%s\n' "$VPKG_SIGNING_KEY" > "$key"
          build/scripts/sign-packages.sh "$key" desktop
          rm -f "$key"

      # Wie "vpkg install @veyra-desktop" auf einem fertigen System: das unveraenderte
      # Entwicklungsabbild bekommt die Pakete der Stufe 5 dazu (VPKG prueft Signaturen und
      # Abhaengigkeiten gegen die Paketdatenbank des Abbilds).
      - name: Desktop-Pakete ins Abbild installieren
        run: |
          set -o pipefail
          zstd -q -d --rm img/veyra-0.6.img.zst -o veyra-desktop.img
          read -r start size < <(sfdisk -J veyra-desktop.img | python3 -c '
          import json, sys
          p = json.load(sys.stdin)["partitiontable"]["partitions"][1]
          print(p["start"] * 512, p["size"] * 512)')
          loop=$(sudo losetup --find --show --offset "$start" --sizelimit "$size" veyra-desktop.img)
          sudo mkdir -p /mnt/veyra
          sudo mount "$loop" /mnt/veyra
          # Nur was veyra-desktop-test braucht (Bauwerkzeuge wie go und simde bleiben draussen).
          sudo python3 packages/base/vpkg/vpkg --root /mnt/veyra install --repo "$PWD/desktop" veyra-desktop-test | tee vpkg-install.log
          sudo python3 packages/base/vpkg/vpkg --root /mnt/veyra list | grep -E 'cage|kitty|foot|mesa|wlroots|seatd|veyra-desktop' | tee -a vpkg-install.log
          if sudo python3 packages/base/vpkg/vpkg --root /mnt/veyra list | grep -qE '^(go|simde) '; then
            echo "Bauwerkzeuge (go, simde) gehoeren nicht ins System" >&2; exit 1
          fi
          df -h /mnt/veyra | tee -a vpkg-install.log
          sudo umount /mnt/veyra
          sudo losetup -d "$loop"

      - name: Desktop-Test (cage mit kitty ueber seatd, Bildschirmfoto)
        run: python3 image/desktop-test.py veyra-desktop.img desktop-logs

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: veyra-desktop-test
          path: |
            desktop-logs
            vpkg-install.log
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: veyra-desktop-pakete
          path: desktop
          retention-days: 7

  audio:
