# Holt Referenzdaten fuer neue Quellen (Versionen, Pruefsummen, Signierer), die aus der
# Entwicklungsumgebung nicht erreichbar sind. Laeuft nur, wenn sich diese Datei aendert,
# oder per Knopfdruck. Aendert nichts im Repository.
name: Quellen-Erkundung

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

jobs:
  grafik:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Aeltere kitty-Versionen ohne slangc?
        run: |
          set +e -u
          cd "$(mktemp -d)"
          export GNUPGHOME=$PWD/g; mkdir -m 700 g
          curl -fsSL https://calibre-ebook.com/signatures/kovid.gpg | gpg -q --import
          for v in 0.50.0 0.49.2 0.48.2; do
            f=kitty-$v.tar.xz
            curl -fsSL -o $f https://github.com/kovidgoyal/kitty/releases/download/v$v/$f || { echo "$v fehlt"; continue; }
            curl -fsSL -o $f.sig https://github.com/kovidgoyal/kitty/releases/download/v$v/$f.sig
            echo "=== $v sha256 $(sha256sum $f | cut -c1-64) $(gpg --status-fd 1 --verify $f.sig $f 2>/dev/null | grep -oE 'VALIDSIG [0-9A-F]+')"
            tar -xJf $f
            ls kitty-$v/kitty/shaders | tr '\n' ' '; echo
            grep -E '^(go|toolchain) ' kitty-$v/go.mod
            grep -cE "slangc" kitty-$v/setup.py
            grep -nE "def build_shaders|generate_shaders\(" kitty-$v/setup.py | head -3
            ls kitty-$v/fonts 2>/dev/null
            grep -nE "wayland_protocols|'protocols'" kitty-$v/glfw/source-info.json 2>/dev/null | head -3
            python3 -c "import json;d=json.load(open('kitty-$v/glfw/source-info.json'));print(d.get('wayland_protocols'), d['wayland']['protocols'])" 2>/dev/null
          done
          echo "--- go1.4-bootstrap Pruefsumme anderswo"
          curl -fsSL https://go.dev/doc/install/source | grep -n -B2 -A2 "go1.4-bootstrap" | head -20
          curl -fsSL "https://gitweb.gentoo.org/repo/gentoo.git/plain/dev-lang/go-bootstrap/Manifest" | head -5
          curl -fsSL "https://git.savannah.gnu.org/cgit/guix.git/plain/gnu/packages/golang.scm" | grep -n -A12 'name "go"' | head -30
