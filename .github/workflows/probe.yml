# Holt Referenzdaten fuer neue Quellen (Versionen, Pruefsummen, Signierer), die aus der
# Entwicklungsumgebung nicht erreichbar sind. Laeuft nur, wenn sich diese Datei aendert,
# oder per Knopfdruck. Aendert nichts im Repository.
name: Quellen-Erkundung

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

jobs:
  grafik:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Pruefsummen fuer kitty-Abhaengigkeiten
        run: |
          set +e -u
          cd "$(mktemp -d)"
          export GNUPGHOME=$PWD/g; mkdir -m 700 g
          for u in https://github.com/pnggroup/libpng/archive/refs/tags/v1.6.59.tar.gz \
                   https://github.com/harfbuzz/harfbuzz/releases/download/14.2.1/harfbuzz-14.2.1.tar.xz \
                   https://github.com/mm2/Little-CMS/releases/download/lcms2.19.1/lcms2-2.19.1.tar.gz \
                   https://gitlab.freedesktop.org/cairo/cairo/-/archive/1.18.4/cairo-1.18.4.tar.bz2 \
                   https://raw.githubusercontent.com/ryanoasis/nerd-fonts/v3.5.1/patched-fonts/NerdFontsSymbolsOnly/SymbolsNerdFontMono-Regular.ttf \
                   https://go.dev/dl/go1.26.11.src.tar.gz; do
            f=${u##*/}; curl -fsSL -m 300 -o "$f" "$u" && echo "$f sha256 $(sha256sum "$f" | cut -c1-64) sha512 $(sha512sum "$f" | cut -c1-128) b2 $(b2sum "$f" | cut -c1-128)"
          done
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | gpg -q --import
          curl -fsSL -o g.asc https://go.dev/dl/go1.26.11.src.tar.gz.asc && gpg --status-fd 1 --verify g.asc go1.26.11.src.tar.gz 2>/dev/null | grep VALIDSIG
          curl -fsSL https://salsa.debian.org/xorg-team/lib/mesa/-/raw/debian-unstable/debian/upstream/signing-key.asc -o m.asc && gpg -q --import m.asc
          curl -fsSL -o mesa.tar.xz https://archive.mesa3d.org/mesa-26.3.1.tar.xz; curl -fsSL -o mesa.sig https://archive.mesa3d.org/mesa-26.3.1.tar.xz.sig
          gpg --status-fd 1 --verify mesa.sig mesa.tar.xz 2>/dev/null | grep VALIDSIG
          echo "--- kitty 0.48.2"
          curl -fsSL -o k.tar.xz https://github.com/kovidgoyal/kitty/releases/download/v0.48.2/kitty-0.48.2.tar.xz && tar -xJf k.tar.xz
          cd kitty-0.48.2
          wc -l go.sum; grep -c '/go.mod h1' go.sum
          ls kitty/*.glsl | head -3; ls fonts 2>/dev/null
          grep -nE "modules = |Disabling building|def init_env" setup.py glfw/glfw.py | head
          grep -nE "libGL|libEGL|dlopen|GLFW_EGL_LIBRARY" glfw/egl_context.c | head -20
          grep -nE "KHR_get_all_proc_addresses" glfw/egl_context.c | head
          grep -nE "cairo|librsync|xxhash|pkg_config\('" setup.py | head -30
          grep -nE "'--[a-z-]+'" setup.py | grep -oE "'--[a-z-]+'" | sort -u | tr '\n' ' '
