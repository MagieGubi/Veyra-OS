# Holt Referenzdaten fuer neue Quellen (Versionen, Pruefsummen, Signierer), die aus der
# Entwicklungsumgebung nicht erreichbar sind. Laeuft nur, wenn sich diese Datei aendert,
# oder per Knopfdruck. Aendert nichts im Repository.
name: Quellen-Erkundung

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

jobs:
  wlan:
    runs-on: ubuntu-latest
    steps:
      - name: iwd, ell, wireless-regdb auf kernel.org (neueste Versionen, SHA-256, Signierer)
        run: |
          set -u
          for d in network/wireless:iwd software/network/wireless-regdb:wireless-regdb; do
            pfad=${d%%:*} name=${d##*:}
            url=https://cdn.kernel.org/pub/$pfad/; case $pfad in network/*) url=https://cdn.kernel.org/pub/linux/$pfad/;; esac
            echo "=== $name ($url)"
            liste=$(curl -fsSL --retry 3 "$url") || { echo "nicht ladbar"; continue; }
            neu=$(echo "$liste" | grep -o "$name-[0-9][0-9.]*\.tar\.xz\"" | tr -d '"' | sort -V | tail -3)
            echo "neueste: $(echo $neu)"
            f=$(echo "$neu" | tail -1)
            curl -fsSL --retry 3 -o "$f" "$url$f"
            curl -fsSL --retry 3 -o "${f%.xz}.sign" "$url${f%.xz}.sign" || echo "keine .sign"
            sha256sum "$f"
            ls -l "$f"
            gpg --list-packets "${f%.xz}.sign" 2>/dev/null | grep -iE "issuer|keyid|created" | head -5
          done
      - name: Schluessel (keys.openpgp.org, keyserver.ubuntu.com, kernel.org)
        run: |
          for f in E932D120BC2AEC444E558F0106CA9F5D1DCF2659 3B6E3D185420C41C4145C3E929F7239293EF1A2C; do
            echo "=== $f"
            for u in "https://keys.openpgp.org/vks/v1/by-fingerprint/$f" "https://keyserver.ubuntu.com/pks/lookup?op=get&options=mr&search=0x$f"; do
              curl -fsSL -m 60 "$u" -o k.asc && echo "$u: $(gpg --with-colons --import-options show-only --import k.asc 2>/dev/null | grep -cE '^fpr') fpr" || echo "$u: nicht ladbar"
            done
          done
          curl -fsS -m 60 -o /dev/null -w "www.kernel.org %{http_code}\n" https://www.kernel.org/signature.html || true
