# Holt Referenzdaten fuer neue Quellen (Versionen, Pruefsummen, Signierer), die aus der
# Entwicklungsumgebung nicht erreichbar sind. Laeuft nur, wenn sich diese Datei aendert,
# oder per Knopfdruck. Aendert nichts im Repository.
name: Quellen-Erkundung

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

jobs:
  grafik:
    runs-on: ubuntu-latest
    steps:
      - name: Schluessel von den Projektseiten
        run: |
          set -u
          export GNUPGHOME=$(mktemp -d)
          for u in https://gitlab.freedesktop.org/emersion.gpg https://gitlab.freedesktop.org/daniels.gpg \
                   https://gitlab.freedesktop.org/svu.gpg https://gitlab.freedesktop.org/whot.gpg \
                   https://gitlab.freedesktop.org/wl.gpg https://gitlab.freedesktop.org/dbaker.gpg \
                   https://codeberg.org/dnkl.gpg https://emersion.fr/.well-known/openpgpkey/hu/dj3498u4hyyarh35rkjfnghbjxug6b19 \
                   https://www.freetype.org/developer.html https://ftp.gnu.org/gnu/gnu-keyring.gpg \
                   https://salsa.debian.org/xorg-team/lib/pixman/-/raw/debian-unstable/debian/upstream/signing-key.asc \
                   https://salsa.debian.org/xorg-team/data/xkeyboard-config/-/raw/debian-unstable/debian/upstream/signing-key.asc \
                   https://salsa.debian.org/xorg-team/lib/libevdev/-/raw/debian-unstable/debian/upstream/signing-key.asc \
                   https://salsa.debian.org/xorg-team/lib/mesa/-/raw/debian-unstable/debian/upstream/signing-key.asc \
                   https://salsa.debian.org/debian/freetype/-/raw/master/debian/upstream/signing-key.asc \
                   https://salsa.debian.org/xorg-team/wayland/wayland-protocols/-/raw/debian-unstable/debian/upstream/signing-key.asc; do
            f=$(mktemp); code=$(curl -sSL -m 60 -o "$f" -w '%{http_code}' "$u")
            echo "$u -> HTTP $code, $(wc -c < "$f") Bytes"
            gpg --with-colons --import-options show-only --import "$f" 2>/dev/null | awk -F: '$1=="fpr"{print "   fpr", $10} $1=="uid"{print "   uid", $10}' | head -8
            gpg --list-packets "$f" 2>/dev/null | grep -m3 -oE 'key expires[^)]*|expires after [^)]*'
          done
          echo "--- freetype Seite"; curl -fsSL -m 60 https://freetype.org/developer.html | grep -iE 'gpg|pgp|key' | head
      - name: Zweite Pruefsumme bei Alpine (git.alpinelinux.org) und Arch
        run: |
          set -u
          for n in pixman libinput hwdata font-dejavu libxkbcommon fontconfig mtdev seatd; do
            for repo in main community; do
              a=$(curl -fsSL -m 30 "https://git.alpinelinux.org/aports/plain/$repo/$n/APKBUILD" 2>/dev/null) || continue
              echo "Alpine $repo/$n: $(echo "$a" | grep -E '^pkgver=') $(echo "$a" | grep -A2 '^source=' | tr -s ' \n' ' ' | cut -c1-220)"
              echo "$a" | sed -n '/^sha512sums=/,$p' | head -4
              break
            done
          done
          for n in pixman; do
            curl -fsSL -m 30 "https://gitlab.archlinux.org/archlinux/packaging/packages/$n/-/raw/main/PKGBUILD" | grep -E '^(pkgver|source|sha512sums|sha256sums|b2sums)=' -A1
          done
      - name: Pruefsummen der Kandidaten
        run: |
          set -u
          cd "$(mktemp -d)"
          for u in https://github.com/xkbcommon/libxkbcommon/archive/refs/tags/xkbcommon-1.13.2.tar.gz \
                   https://gitlab.freedesktop.org/libinput/libinput/-/archive/1.32.0/libinput-1.32.0.tar.gz \
                   https://gitlab.freedesktop.org/api/v4/projects/890/packages/generic/fontconfig/2.18.4/fontconfig-2.18.4.tar.xz \
                   https://www.x.org/releases/individual/lib/pixman-0.46.4.tar.gz; do
            f=${u##*/}; curl -fsSL -m 300 -o "$f" "$u" && echo "$f sha256 $(sha256sum "$f" | cut -c1-64) sha512 $(sha512sum "$f" | cut -c1-128)"
          done
          curl -fsSL -m 60 https://gitlab.freedesktop.org/api/v4/projects/890/packages/generic/fontconfig/2.18.4/fontconfig-2.18.4.tar.xz.sha256sum
          curl -fsSL -m 60 https://www.x.org/releases/individual/lib/pixman-0.46.4.tar.xz.sha512
