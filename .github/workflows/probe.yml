# Holt Referenzdaten fuer neue Quellen (Versionen, Pruefsummen, Signierer), die aus der
# Entwicklungsumgebung nicht erreichbar sind. Laeuft nur, wenn sich diese Datei aendert,
# oder per Knopfdruck. Aendert nichts im Repository.
name: Quellen-Erkundung

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

jobs:
  wlan:
    runs-on: ubuntu-latest
    steps:
      - name: iwd, ell, wireless-regdb auf kernel.org (neueste Versionen, SHA-256, Signierer)
        run: |
          set -u
          for d in network/wireless:iwd software/network/wireless-regdb:wireless-regdb; do
            pfad=${d%%:*} name=${d##*:}
            url=https://cdn.kernel.org/pub/$pfad/; case $pfad in network/*) url=https://cdn.kernel.org/pub/linux/$pfad/;; esac
            echo "=== $name ($url)"
            liste=$(curl -fsSL --retry 3 "$url") || { echo "nicht ladbar"; continue; }
            neu=$(echo "$liste" | grep -o "$name-[0-9][0-9.]*\.tar\.xz\"" | tr -d '"' | sort -V | tail -3)
            echo "neueste: $(echo $neu)"
            f=$(echo "$neu" | tail -1)
            curl -fsSL --retry 3 -o "$f" "$url$f"
            curl -fsSL --retry 3 -o "${f%.xz}.sign" "$url${f%.xz}.sign" || echo "keine .sign"
            sha256sum "$f"
            ls -l "$f"
            gpg --list-packets "${f%.xz}.sign" 2>/dev/null | grep -iE "issuer|keyid|created" | head -5
          done
      - name: Schluessel von Projekt- und Distributionsseiten
        run: |
          zeige() { gpg --with-colons --import-options show-only --import "$1" 2>/dev/null | awk -F: '$1=="fpr"||$1=="uid"{print "   "$1" "$10}' | head -4; }
          for k in 06CA9F5D1DCF2659 389A54219C0F2430; do
            u="https://kernel.googlesource.com/pub/scm/docs/kernel/pgpkeys/+/refs/heads/master/keys/$k.asc?format=TEXT"
            curl -fsSL -m 60 "$u" | base64 -d > k.asc 2>/dev/null && echo "googlesource $k: $(wc -c < k.asc) Bytes" && zeige k.asc || echo "googlesource $k: nicht ladbar"
          done
          for u in https://salsa.debian.org/debian/iwd/-/raw/debian/latest/debian/upstream/signing-key.asc \
                   https://salsa.debian.org/debian/iwd/-/raw/master/debian/upstream/signing-key.asc \
                   https://salsa.debian.org/debian/ell/-/raw/debian/latest/debian/upstream/signing-key.asc \
                   https://salsa.debian.org/debian/ell/-/raw/master/debian/upstream/signing-key.asc \
                   https://salsa.debian.org/kernel-team/wireless-regdb/-/raw/master/debian/upstream/signing-key.asc \
                   https://salsa.debian.org/debian/wireless-regdb/-/raw/master/debian/upstream/signing-key.asc \
                   https://salsa.debian.org/kernel-team/wireless-regdb/-/raw/debian/latest/debian/upstream/signing-key.asc; do
            curl -fsSL -m 60 "$u" -o k.asc && echo "$u" && zeige k.asc || echo "$u: nicht ladbar"
          done
          for d in debian/wireless-regdb debian/iwd debian/ell kernel-team/wireless-regdb; do
            echo "$d: $(curl -fsS -m 30 "https://salsa.debian.org/api/v4/projects/${d/\//%2F}" | python3 -c 'import json,sys;print(json.load(sys.stdin)["default_branch"])' 2>&1 | tail -1)"
          done
