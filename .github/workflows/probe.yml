# Holt Referenzdaten fuer neue Quellen (Versionen, Pruefsummen, Signierer) und Ergebnisse,
# die aus der Entwicklungsumgebung nicht erreichbar sind. Laeuft nur, wenn sich diese Datei
# aendert, oder per Knopfdruck. Aendert nichts im Repository.
name: Quellen-Erkundung

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bildschirmfoto:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Bildschirmfoto des Desktop-Tests als Text ausgeben
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e -u
          cd "$(mktemp -d)"
          gh run download 44721414747 -R "$GITHUB_REPOSITORY" -n veyra-desktop-test
          ls -la
          ls -la desktop-logs; sha256sum desktop-logs/veyra-desktop.png
          echo "BEGIN-PNG"; base64 -w 0 desktop-logs/veyra-desktop.png; echo; echo "END-PNG"
