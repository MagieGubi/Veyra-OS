# Holt Referenzdaten fuer neue Quellen (Versionen, Pruefsummen, Optionen), die aus der
# Entwicklungsumgebung nicht erreichbar sind. Laeuft nur, wenn sich diese Datei aendert,
# oder per Knopfdruck. Aendert nichts im Repository.
name: Quellen-Erkundung

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wlan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: hostapd 2.12 (Pruefsumme, Signatur, defconfig)
        run: |
          set +e -u
          cd "$(mktemp -d)"
          curl -fsSL -o hostapd-2.12.tar.gz http://w1.fi/releases/hostapd-2.12.tar.gz && sha256sum hostapd-2.12.tar.gz
          curl -fsSL -o hostapd-2.12.tar.gz.asc http://w1.fi/releases/hostapd-2.12.tar.gz.asc && cat hostapd-2.12.tar.gz.asc
          curl -fsSL https://w1.fi/releases/ | grep -o 'hostapd-2\.[0-9]*\.tar\.gz' | sort -uV | tail -3
          tar -xzf hostapd-2.12.tar.gz && grep -E "^#?CONFIG_" hostapd-2.12/hostapd/defconfig | cut -c1-100
          grep -n "LIBS += -lnl\|pkg-config\|NEED_SAE\|CONFIG_SAE" hostapd-2.12/hostapd/Makefile | head -20
