# Holt Referenzdaten fuer neue Quellen (Versionen, Pruefsummen, Signierer), die aus der
# Entwicklungsumgebung nicht erreichbar sind. Laeuft nur, wenn sich diese Datei aendert,
# oder per Knopfdruck. Aendert nichts im Repository.
name: Quellen-Erkundung

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

jobs:
  grafik:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: kitty-Bau, zweite Pruefsummen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e -u
          cd "$(mktemp -d)"
          curl -fsSL -o k.tar.xz https://github.com/kovidgoyal/kitty/releases/download/v0.51.0/kitty-0.51.0.tar.xz && tar -xJf k.tar.xz
          cd kitty-0.51.0
          echo "--- vendor/ und Shader"; ls; ls vendor 2>/dev/null | head; ls kitty/shaders | head -30
          sed -n '1430,1475p' setup.py
          grep -nE "def (build_shaders|compile_shaders|slang)|slangc|SLANG" setup.py kitty/shaders/*.py 2>/dev/null | head -20
          grep -nE "add_argument\(" setup.py | sed -n '1,80p' | cut -c1-150
          grep -nE "Symbols|nerd" -i setup.py | head
          cd ..
          echo "--- Alpine/Arch"
          for n in harfbuzz lcms2 xxhash simde cairo libpng kitty font-nerd-fonts-symbols py3-mako py3-yaml go mesa; do
            for repo in main community; do
              a=$(curl -fsSL -m 30 "https://git.alpinelinux.org/aports/plain/$repo/$n/APKBUILD" 2>/dev/null) || continue
              echo "Alpine $repo/$n: $(echo "$a" | grep -E '^pkgver=') $(echo "$a" | grep -A3 '^source=' | tr -s ' \n' ' ' | cut -c1-260)"
              echo "$a" | sed -n '/^sha512sums=/,$p' | head -4
              break
            done
          done
          for n in go ttf-nerd-fonts-symbols simde xxhash libpng; do
            echo "Arch $n:"; curl -fsSL -m 30 "https://gitlab.archlinux.org/archlinux/packaging/packages/$n/-/raw/main/PKGBUILD" | grep -E -A2 '^(pkgver|source|sha256sums|sha512sums|b2sums|validpgpkeys)=' | head -14
          done
          echo "--- Dateien und Pruefsummen"
          for u in https://github.com/harfbuzz/harfbuzz/releases/download/15.2.0/harfbuzz-15.2.0.tar.xz \
                   https://github.com/mm2/Little-CMS/releases/download/lcms2.20/lcms2-2.20.tar.gz \
                   https://github.com/Cyan4973/xxHash/archive/refs/tags/v0.8.3.tar.gz \
                   https://github.com/simd-everywhere/simde/archive/refs/tags/v0.8.2.tar.gz \
                   https://www.cairographics.org/releases/cairo-1.18.4.tar.xz \
                   https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/NerdFontsSymbolsOnly.tar.xz \
                   https://files.pythonhosted.org/packages/source/m/mako/mako-1.4.3.tar.gz \
                   https://files.pythonhosted.org/packages/source/p/pyyaml/pyyaml-6.0.3.tar.gz \
                   https://dl.google.com/go/go1.4-bootstrap-20171003.tar.gz; do
            f=${u##*/}; curl -fsSL -m 300 -o "$f" "$u" && echo "$f sha256 $(sha256sum "$f" | cut -c1-64) sha512 $(sha512sum "$f" | cut -c1-128)"
          done
          curl -fsSL https://download.sourceforge.net/libpng/libpng-1.6.53.tar.xz -o png.tar.xz && echo "libpng-1.6.53 $(sha256sum png.tar.xz | cut -c1-64)"
          curl -fsSL "https://sourceforge.net/projects/libpng/rss?path=/libpng16" | grep -oE 'libpng-1\.6\.[0-9]+\.tar\.xz' | sort -uV | tail -3
          curl -fsSL "https://go.dev/dl/?mode=json&include=all" | python3 -c '
          import json,sys
          for r in json.load(sys.stdin):
            for f in r["files"]:
              if f["kind"]=="source" and r["version"].startswith(("go1.26","go1.4")): print(r["version"], f["sha256"])' | sort -uV | tail -4
          echo "--- Go-Signaturschluessel"
          export GNUPGHOME=$PWD/g; mkdir -m 700 g
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub -o gk.pub; gpg --show-keys --with-colons gk.pub 2>/dev/null | grep -E '^(fpr|uid)' | head -8
          gpg -q --import gk.pub
          for v in go1.17.13 go1.20.14 go1.22.12 go1.24.13 go1.4-bootstrap-20171003; do
            curl -fsSL -o s.asc "https://dl.google.com/go/$v.src.tar.gz.asc" 2>/dev/null || curl -fsSL -o s.asc "https://dl.google.com/go/$v.tar.gz.asc" 2>/dev/null || { echo "$v: keine .asc"; continue; }
            f=$v.src.tar.gz; [ -f go1.4-bootstrap-20171003.tar.gz ] && [ "$v" = go1.4-bootstrap-20171003 ] && f=go1.4-bootstrap-20171003.tar.gz
            [ -f "$f" ] || curl -fsSL -o "$f" "https://dl.google.com/go/$f"
            echo "$v: $(gpg --status-fd 1 --verify s.asc "$f" 2>/dev/null | grep -E 'VALIDSIG|ERRSIG|BADSIG' | cut -c1-120)"
          done
