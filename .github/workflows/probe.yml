# Holt Referenzdaten fuer neue Quellen (Versionen, Pruefsummen, Signierer), die aus der
# Entwicklungsumgebung nicht erreichbar sind. Laeuft nur, wenn sich diese Datei aendert,
# oder per Knopfdruck. Aendert nichts im Repository.
name: Quellen-Erkundung

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

jobs:
  grafik:
    runs-on: ubuntu-latest
    steps:
      - name: Verzeichnisse mit Releases (neueste Versionen, Signaturen)
        run: |
          set -u
          neueste() {  # URL MUSTER
            curl -fsSL -m 60 --retry 2 "$1" 2>/dev/null | grep -oE "$2" | sort -uV | tail -4 | tr '\n' ' '
          }
          zeile() { echo "$1: $(neueste "$2" "$3")"; }
          zeile libdrm https://dri.freedesktop.org/libdrm/ 'libdrm-2\.4\.[0-9]+\.tar\.xz(\.sig)?'
          zeile wayland https://gitlab.freedesktop.org/wayland/wayland/-/releases 'wayland-1\.[0-9]+\.[0-9]+\.tar\.xz(\.sig)?'
          zeile wayland-protocols https://gitlab.freedesktop.org/wayland/wayland-protocols/-/releases 'wayland-protocols-1\.[0-9]+\.tar\.xz(\.sig)?'
          zeile pixman https://www.x.org/releases/individual/lib/ 'pixman-0\.[0-9]+\.[0-9]+\.tar\.(xz|gz)(\.sig)?'
          zeile xkeyboard-config https://www.x.org/releases/individual/data/xkeyboard-config/ 'xkeyboard-config-2\.[0-9]+\.tar\.xz(\.sig)?'
          zeile libxkbcommon https://xkbcommon.org/download/ 'libxkbcommon-1\.[0-9]+\.[0-9]+\.tar\.xz(\.sig)?'
          zeile libevdev https://www.freedesktop.org/software/libevdev/ 'libevdev-1\.[0-9]+\.[0-9]+\.tar\.xz(\.sig)?'
          zeile mtdev https://bitmath.org/code/mtdev/ 'mtdev-1\.[0-9]+\.[0-9]+\.tar\.(gz|bz2)'
          zeile libinput https://gitlab.freedesktop.org/libinput/libinput/-/releases 'libinput-1\.[0-9]+\.[0-9]+\.tar\.xz(\.sig)?'
          zeile seatd https://git.sr.ht/~kennylevinsen/seatd/refs '0\.[0-9]+\.[0-9]+\.tar\.gz(\.sig)?'
          zeile wlroots https://gitlab.freedesktop.org/wlroots/wlroots/-/releases 'wlroots-0\.[0-9]+\.[0-9]+\.tar\.gz(\.sig)?'
          zeile mesa https://archive.mesa3d.org/ 'mesa-2[0-9]\.[0-9]+\.[0-9]+\.tar\.xz(\.sig)?'
          zeile freetype https://download.savannah.gnu.org/releases/freetype/ 'freetype-2\.[0-9]+\.[0-9]+\.tar\.xz(\.sig)?'
          zeile fontconfig https://www.freedesktop.org/software/fontconfig/release/ 'fontconfig-2\.[0-9]+\.[0-9]+\.tar\.xz'
          zeile harfbuzz https://github.com/harfbuzz/harfbuzz/releases 'harfbuzz-[0-9]+\.[0-9]+\.[0-9]+\.tar\.xz'
          zeile libpng https://download.sourceforge.net/libpng/ 'libpng-1\.6\.[0-9]+\.tar\.xz'
          zeile lcms2 https://github.com/mm2/Little-CMS/releases 'lcms2-2\.[0-9]+\.tar\.gz'
          zeile go https://go.dev/dl/ 'go1\.2[0-9]+(\.[0-9]+)?\.src\.tar\.gz'
          zeile kitty https://github.com/kovidgoyal/kitty/releases 'kitty-0\.[0-9]+\.[0-9]+\.tar\.xz(\.sig)?'
          zeile cage https://github.com/cage-kiosk/cage/releases 'cage-0\.[0-9]+\.[0-9]+\.tar\.gz(\.sig)?'
          zeile hwdata https://github.com/vcrhonek/hwdata/tags 'v0\.[0-9]+\.tar\.gz'
          zeile dejavu https://github.com/dejavu-fonts/dejavu-fonts/releases 'dejavu-fonts-ttf-2\.[0-9]+\.tar\.bz2'
          for p in Mako PyYAML; do echo "$p: $(curl -fsSL -m 30 https://pypi.org/pypi/$p/json | python3 -c 'import json,sys;print(json.load(sys.stdin)["info"]["version"])')"; done
