# Holt Referenzdaten fuer neue Quellen (Versionen, Pruefsummen, Signierer), die aus der
# Entwicklungsumgebung nicht erreichbar sind. Laeuft nur, wenn sich diese Datei aendert,
# oder per Knopfdruck. Aendert nichts im Repository.
name: Quellen-Erkundung

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

jobs:
  grafik:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Restliche Pruefungen
        run: |
          set +e -u
          cd "$(mktemp -d)"
          export GNUPGHOME=$PWD/g; mkdir -m 700 g
          u=https://gitlab.freedesktop.org/api/v4/projects/890/packages/generic/fontconfig/2.18.1/fontconfig-2.18.1.tar.xz
          curl -fsSL -o fc.tar.xz "$u"; echo "fontconfig-2.18.1 sha256 $(sha256sum fc.tar.xz | cut -c1-64) sha512 $(sha512sum fc.tar.xz | cut -c1-128)"
          curl -fsSL https://www.freedesktop.org/software/libevdev/libevdev-1.14.0.tar.xz -o ev.tar.xz; echo "libevdev sha512 $(sha512sum ev.tar.xz | cut -c1-128)"
          curl -fsSL https://git.alpinelinux.org/aports/plain/main/libevdev/APKBUILD | sed -n '/^sha512sums=/,$p' | head -3
          curl -fsSL https://gitlab.archlinux.org/archlinux/packaging/packages/libevdev/-/raw/main/PKGBUILD | grep -E -A1 '^(source|sha512sums|sha256sums|b2sums|validpgpkeys)='
          echo "--- libevdev Schluessel bei Debian"
          curl -fsSL https://salsa.debian.org/xorg-team/lib/libevdev/-/raw/debian-unstable/debian/upstream/signing-key.asc -o ev.asc; head -c 300 ev.asc; echo; gpg --import ev.asc 2>&1 | head -5
          gpg --show-keys ev.asc 2>&1 | head -12
          echo "--- GNU-Schluesselbund und Werner Lemberg"
          curl -fsSL https://ftp.gnu.org/gnu/gnu-keyring.gpg -o gnu.gpg; gpg --show-keys --with-colons gnu.gpg 2>/dev/null | grep -i -B1 -A1 lemberg | head
          echo "--- dnkl-Signaturen"
          curl -fsSL https://codeberg.org/dnkl.gpg -o dnkl.asc; gpg -q --import dnkl.asc
          for x in foot/1.28.0/foot-1.28.0 fcft/3.3.3/fcft-3.3.3 tllist/1.1.0/tllist-1.1.0; do
            n=${x%%/*}; curl -fsSL -o a.tgz "https://codeberg.org/dnkl/$n/releases/download/${x#*/}.tar.gz"; curl -fsSL -o a.sig "https://codeberg.org/dnkl/$n/releases/download/${x#*/}.tar.gz.sig"
            echo "$x sha256 $(sha256sum a.tgz | cut -c1-64)"; gpg --status-fd 1 --verify a.sig a.tgz 2>/dev/null | grep -E 'VALIDSIG|ERRSIG|BADSIG'
          done
          for f in B19964FBBA09664CC81027ED5BBD4992C116573F; do curl -fsSL "https://keyserver.ubuntu.com/pks/lookup?op=get&options=mr&search=0x$f" | gpg --show-keys --with-colons 2>/dev/null | grep -E '^(fpr|uid)' | head -4; done
